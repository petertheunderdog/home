<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>차곡</title>
<meta name="description" content="차곡 · 우리집 가계부와 자산 관리">
<meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101113" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="차곡">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="stylesheet" href="app.css?v=3">
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="hl">
      <button class="nav" id="prev" aria-label="이전 달">‹</button>
      <h1 id="title">가계부</h1>
      <button class="nav" id="next" aria-label="다음 달">›</button>
    </div>
    <div class="hr">
      <button class="ic" id="refresh" aria-label="새로고침"><span>↻</span></button>
      <button class="ic solid" id="addBtn" aria-label="거래 추가"><span>+</span></button>
    </div>
  </header>
  <div id="status" class="status"></div>
  <main id="main">
    <section class="pg on" data-p="home" id="pgHome"></section>
    <section class="pg" data-p="tx" id="pgTx">
      <div class="search"><input id="q" type="search" placeholder="가맹점, 내용, 금액 검색" autocomplete="off"></div>
      <div class="chips" id="txChips"></div>
      <div id="txList"></div>
    </section>
    <section class="pg" data-p="asset" id="pgAsset"></section>
    <section class="pg" data-p="set" id="pgSet"></section>
  </main>
  <nav id="tabs">
    <button class="tab on" data-t="home"><i></i>홈</button>
    <button class="tab" data-t="tx"><i></i>거래</button>
    <button class="tab" data-t="asset"><i></i>자산</button>
    <button class="tab" data-t="set"><i></i>설정</button>
  </nav>
</div>

<div id="connect" hidden>
  <div class="cbox">
    <img class="logo" src="logo-256.png" alt="">
    <h2>차곡</h2>
    <p>우리집 가계부와 자산을 한곳에서</p>
    <button class="gbtn" id="gBtn"><svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>Google 계정으로 로그인</span></button>
    <div class="err" id="keyErr"></div>
    <p class="cnote">등록된 가족 계정만 들어올 수 있어요</p>
    <details class="alt"><summary>연결 코드로 연결</summary>
      <input id="keyIn" type="text" placeholder="연결 코드 (gb_로 시작)" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn" id="keyBtn">연결하기</button>
    </details>
  </div>
</div>

<div id="scrim" hidden></div>
<div id="sheet" aria-modal="true" role="dialog"></div>
<div id="toast"></div>

<script src="app.js?v=6"></script>
</body>
</html>
