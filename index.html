<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>차곡</title>
<meta name="description" content="차곡 · 우리집 가계부 · 자산 · 출산준비">
<meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101113" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="차곡">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="stylesheet" href="app.css?v=8">
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="hl">
      <button class="nav" id="prev" aria-label="이전 달">‹</button>
      <h1 id="title">가계부</h1>
      <button class="nav" id="next" aria-label="다음 달">›</button>
    </div>
    <div class="hr">
      <button class="ic" id="refresh" aria-label="새로고침"><span>↻</span></button>
      <button class="ic solid" id="addBtn" aria-label="거래 추가"><span>+</span></button>
    </div>
  </header>
  <div id="status" class="status"></div>
  <main id="main">
    <section class="pg on" data-p="home" id="pgHome"></section>
    <section class="pg" data-p="tx" id="pgTx">
      <div class="seg pseg" id="ledSeg"><button data-led="sum" class="on">요약</button><button data-led="list">내역</button></div>
      <div id="ledSum"></div>
      <div id="ledList" hidden>
        <div class="search"><input id="q" type="search" placeholder="가맹점, 내용, 금액 검색" autocomplete="off"></div>
        <div class="chips" id="txChips"></div>
        <div id="txList"></div>
      </div>
    </section>
    <section class="pg" data-p="asset" id="pgAsset"></section>
    <section class="pg" data-p="baby" id="pgBaby"></section>
    <section class="pg" data-p="set" id="pgSet"></section>
  </main>
  <nav id="tabs">
    <button class="tab on" data-t="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6h-6v6H4.5a1 1 0 0 1-1-1z"/></svg><span>홈</span></button>
    <button class="tab" data-t="tx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg><span>가계부</span></button>
    <button class="tab" data-t="asset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16"/><path d="M5 16l4.5-5 3.5 3 6-7"/><path d="M15 7h4v4"/></svg><span>자산</span></button>
    <button class="tab" data-t="baby"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v6h8a7.5 7.5 0 0 0-8-6z"/><path d="M2.5 6H5l1.6 5.4A3 3 0 0 0 9.5 13.5H17a3 3 0 0 0 3-3V10"/><circle cx="9" cy="18.5" r="1.8"/><circle cx="17" cy="18.5" r="1.8"/></svg><span>출산준비</span></button>
    <button class="tab" data-t="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>설정</span></button>
  </nav>
</div>

<div id="connect" hidden>
  <div class="cbox">
    <img class="logo" src="logo-256.png" alt="">
    <h2>차곡</h2>
    <p>우리집 가계부 · 자산 · 출산준비를 한곳에서</p>
    <button class="gbtn" id="gBtn"><svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>Google 계정으로 로그인</span></button>
    <div class="err" id="keyErr"></div>
    <p class="cnote">등록된 가족 계정만 들어올 수 있어요</p>
    <details class="alt"><summary>연결 코드로 연결</summary>
      <input id="keyIn" type="text" placeholder="연결 코드 (gb_로 시작)" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn" id="keyBtn">연결하기</button>
    </details>
  </div>
</div>

<div id="scrim" hidden></div>
<div id="sheet" aria-modal="true" role="dialog"></div>
<div id="toast"></div>

<script src="app.js?v=13"></script>
</body>
</html>
